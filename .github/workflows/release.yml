name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # secrets 不能用于 steps.if，先映射到 job 级 env 供条件判断与脚本共用
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches VERSION
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(head -n1 VERSION | tr -d '[:space:]')"
          if [ "$tag" != "$version" ]; then
            echo "tag v${tag} 与 VERSION 文件 ${version} 不一致" >&2
            exit 1
          fi

      - name: Run packaging tests
        run: |
          python -m pip install pytest
          python -m pytest packaging/tests/

      - name: Download fnpack
        run: |
          curl -fsSL -o fnpack \
            "https://static2.fnnas.com/fnpack/fnpack-${FNPACK_VERSION}-linux-amd64"
          chmod +x fnpack && sudo mv fnpack /usr/local/bin/fnpack
        env:
          FNPACK_VERSION: "1.2.3"

      - name: Build fpk package
        run: |
          ./packaging/fpk/build.sh
          ls -la dist/

      - name: Prepare online fpk asset
        # CI 环境没有 1.2GB 的内置镜像（images/ 已被 .gitignore 排除），只能构建「在线版」。
        # 为避免每次发版把维护者手动上传的「离线版」fnmusic-ext-<ver>.fpk 覆盖掉，
        # 这里把 CI 产物固定改名为 fnmusic-ext-<ver>-online.fpk 再发布；
        # 规范名 fnmusic-ext-<ver>.fpk（约 412MB、内置镜像、免联网）由维护者手动上传，CI 永不触碰。
        run: |
          ver="${GITHUB_REF_NAME#v}"
          built="$(ls dist/fnmusic-ext-*.fpk)"
          online_fpk="dist/fnmusic-ext-${ver}-online.fpk"
          cp -f "$built" "$online_fpk"
          sha256sum "$online_fpk" > "${online_fpk}.sha256"
          ls -la "$online_fpk" "${online_fpk}.sha256"

      - name: Extract changelog for this version
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > /tmp/release-notes.md
          if [ ! -s /tmp/release-notes.md ]; then
            echo "CHANGELOG.md 中未找到 ## [$version] 段落" >&2
            exit 1
          fi
          head -5 /tmp/release-notes.md
          # 追加安装包说明：CI 只附「在线版」，规范名的「离线版」由维护者手动上传
          {
            cat /tmp/release-notes.md
            echo
            echo "---"
            echo
            echo "### 安装包（fpk）"
            echo
            echo "> ⚠️ CI 自动附加的是**在线版** \`fnmusic-ext-${version}-online.fpk\`（约 5MB，安装时需联网拉取基础镜像）。"
            echo "> **离线版** \`fnmusic-ext-${version}.fpk\`（约 412MB，内置镜像、免联网安装）由维护者手动上传；若暂缺，请稍后刷新本页面。"
          } > /tmp/release-notes-final.md

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          online_fpk="dist/fnmusic-ext-${ver}-online.fpk"
          title="fnmusic-ext ${ver}"
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            # 同 tag 重跑 == 同一版本内重发。已发布的资产是用户**已经拿走**的文件，
            # 原地顶掉会让「文件名下的内容」与用户手里的记录对不上，且无法回滚
            # （旧版是唯一的退路）。所以这里只补传缺失的资产：已有的一律跳过，
            # 绝不覆盖；发行说明也已发布，同样不改。
            existing="$(gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets[].name')"
            for f in "${online_fpk}" "${online_fpk}.sha256"; do
              name="$(basename "${f}")"
              if printf '%s\n' "${existing}" | grep -qxF "${name}"; then
                echo "[github] ${name} 已存在，按纪律不覆盖，跳过"
              else
                echo "[github] ${name} 缺失，补传"
                gh release upload "${GITHUB_REF_NAME}" "$f"
              fi
            done
            echo "[github] 本次未覆盖任何已发布资产，发行说明亦未改动。"
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "$title" \
              --notes-file /tmp/release-notes-final.md \
              "$online_fpk" "${online_fpk}.sha256"
          fi

      # Gitee 镜像只同步分支/标签/提交，发行版需经 API 发布；发布的是同一份
      # 「在线版」产物（与 GitHub 字节一致、sha256 相同）。未配置 GITEE_TOKEN 密钥时本步跳过。
      - name: Publish release to Gitee
        if: env.GITEE_TOKEN != ''
        env:
          GITEE_REPO: yygitee118/fnos_music_ext
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          ver="${tag#v}"
          online_fpk="dist/fnmusic-ext-${ver}-online.fpk"
          api="https://gitee.com/api/v5/repos/${GITEE_REPO}"

          # 镜像同步有延迟，轮询等 tag 出现在 Gitee（公开仓库 ls-remote 无需认证）
          synced=0
          for _ in $(seq 1 20); do
            if [ -n "$(git ls-remote "https://gitee.com/${GITEE_REPO}.git" "refs/tags/${tag}")" ]; then
              synced=1
              break
            fi
            sleep 30
          done
          if [ "${synced}" != 1 ]; then
            echo "ERROR: Gitee 镜像 10 分钟内未同步到 tag ${tag}" >&2
            exit 1
          fi

          # 查发行版是否已存在（重跑安全）：gitee 对不存在的发行版返回 200 + body
          # 为 null 而非 404，必须按 body 里有无 id 判断，不能只看 HTTP 码
          http="$(curl -sS -o /tmp/gitee-release.json -w '%{http_code}' \
            "${api}/releases/tags/${tag}?access_token=${GITEE_TOKEN}")"
          release_id=""
          if [ "${http}" = 200 ]; then
            release_id="$(jq -r 'if .id then .id else "" end' /tmp/gitee-release.json)"
          elif [ "${http}" != 404 ]; then
            echo "ERROR: 查询 Gitee 发行版失败 HTTP ${http}" >&2
            cat /tmp/gitee-release.json >&2 || true
            exit 1
          fi
          release_created=0
          if [ -n "${release_id}" ]; then
            # 同 tag 重跑 == 同一版本内重发。已发布的附件是用户**已经拿走**的文件，
            # 删掉再传会让已下载的用户手里的链接失效，且删除不可逆、无法回滚。
            # 改为只补传缺失的附件：已存在的一律跳过，绝不删除、绝不覆盖。
            # 附件列表在下面统一查（by-tag 响应的 assets 不带附件 id，
            # 需走附件列表接口拿名字），这里只标记「不是新建的」。
            echo "[gitee] 发行版已存在（${release_id}），将只补传缺失的附件，不触碰已有附件"
          else
            # 创建：gitee 要求 target_commitish 必传（tag 已存在时仅作落点声明）
            create_http="$(curl -sS -o /tmp/gitee-create.json -w '%{http_code}' "${api}/releases" \
              -d "access_token=${GITEE_TOKEN}" \
              -d "tag_name=${tag}" \
              -d "target_commitish=${tag}" \
              -d "name=fnmusic-ext ${ver}" \
              --data-urlencode "body@/tmp/release-notes-final.md")"
            if [ "${create_http}" != 201 ] && [ "${create_http}" != 200 ]; then
              echo "ERROR: 创建 Gitee 发行版失败 HTTP ${create_http}" >&2
              cat /tmp/gitee-create.json >&2 || true
              exit 1
            fi
            release_id="$(jq -r '.id' /tmp/gitee-create.json)"
            release_created=1
          fi

          # 上传「在线版」fpk + sha256，收集下载链接（实测返回单对象browser_download_url，
          # 保留数组/对象兼容解析以防变动）
          #
          # 【为什么要先查重名】同 tag 重跑时，若不管不顾地再传一遍，要么平台报错，
          # 要么产生同名重复附件让用户下到不确定哪一份。而重传本身毫无意义：
          # 已下载过的用户手里那份不会因此改变，新下载的人拿到的内容也一样。
          # 正确做法是跳过已存在的，只补真正缺的。
          #
          # 【必须用显式标记，不能靠「文件是否存在」判断】同一 runner 上可能残留
          # 上一次跑留下的 gitee-att-list.json。若用 `[ -f ... ]` 判断，新建发行版的
          # 分支里会误读那份残留，把本次要传的附件全判成「已存在」而跳过 ——
          # 发行版建好了却一个附件都没有。只有「本次真的查过列表」才允许跳过。
          fetched_list=0
          if [ -n "${release_id}" ] && [ "${release_created}" != 1 ]; then
            curl -sSf -o /tmp/gitee-att-list.json \
              "${api}/releases/${release_id}/attach_files?access_token=${GITEE_TOKEN}"
            fetched_list=1
          fi
          if [ "${fetched_list}" = 1 ]; then
            jq -r '.[].name' /tmp/gitee-att-list.json | sort -u > /tmp/gitee-existing.txt
          else
            : > /tmp/gitee-existing.txt          # 新建发行版：附件列表为空
          fi
          attach_links=""
          for f in "${online_fpk}" "${online_fpk}.sha256"; do
            name="$(basename "${f}")"
            if grep -qxF "${name}" /tmp/gitee-existing.txt; then
              echo "[gitee] ${name} 已存在，按纪律不覆盖，跳过"
              # 跳过的也要在说明里给出链接，否则用户看不到已有附件的下载地址
              old_url="$(jq -r --arg n "${name}" \
                '(.[]? | select(.name == $n) | .browser_download_url) // empty' \
                /tmp/gitee-att-list.json 2>/dev/null | head -n1)"
              if [ -n "${old_url}" ]; then
                attach_links="${attach_links}- [${name}](${old_url})"$'\n'
              fi
              continue
            fi
            att_http="$(curl -sS -o /tmp/gitee-att-one.json -w '%{http_code}' \
              "${api}/releases/${release_id}/attach_files" \
              -F "access_token=${GITEE_TOKEN}" \
              -F "file=@${f}")"
            if [ "${att_http}" != 201 ] && [ "${att_http}" != 200 ]; then
              echo "ERROR: 上传附件 ${f} 失败 HTTP ${att_http}" >&2
              cat /tmp/gitee-att-one.json >&2 || true
              exit 1
            fi
            url="$(jq -r 'if type == "array" then .[0].url else (.url // .browser_download_url) end' /tmp/gitee-att-one.json)"
            if [ -z "${url}" ] || [ "${url}" = "null" ]; then
              echo "ERROR: Gitee 附件上传后未解析到下载 URL（响应形态可能变了）" >&2
              exit 1
            fi
            echo "[gitee] ${name} 缺失，补传"
            attach_links="${attach_links}- [${name}](${url})"$'\n'
          done

          # 更新说明 = changelog + 安装包说明 + 附件下载链接；PATCH 必须重传 tag_name 与 name
          {
            cat /tmp/release-notes-final.md
            echo
            echo "### 附件"
            printf '%s' "${attach_links}"
          } > /tmp/gitee-body.md
          patch_http="$(curl -sS -o /tmp/gitee-patch.json -w '%{http_code}' -X PATCH \
            "${api}/releases/${release_id}?access_token=${GITEE_TOKEN}" \
            -d "tag_name=${tag}" \
            -d "name=fnmusic-ext ${ver}" \
            --data-urlencode "body@/tmp/gitee-body.md")"
          if [ "${patch_http}" != 200 ]; then
            echo "ERROR: 更新 Gitee 发行版说明失败 HTTP ${patch_http}" >&2
            cat /tmp/gitee-patch.json >&2 || true
            exit 1
          fi
          echo "[gitee] 发行版发布完成: https://gitee.com/${GITEE_REPO}/releases"

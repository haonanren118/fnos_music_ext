; fnmusic-sources 容器进程表：五个程序全部 autostart=false，
; 由 entrypoint.sh 按 /repo/.env 的启用开关 supervisorctl start（按需加载）。
; 运行期切源 = supervisorctl stop/start（WebUI 同容器内调用），无需 docker.sock。
; lxserver（#55 公共歌单发现层）仅在洛雪音源启用时随 lxmusic 一同拉起。

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:musicdl]
directory=/srv/musicdl-service
command=uvicorn app:app --host 0.0.0.0 --port 8001
autostart=false
autorestart=true
startretries=5
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:musicbox]
directory=/srv/musicbox-service
command=uvicorn app:app --host 0.0.0.0 --port 8002
autostart=false
autorestart=true
startretries=5
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:lxserver]
directory=/srv/lxserver
command=node index.js
autostart=false
autorestart=true
startretries=5
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
environment=DATA_PATH="/data/lxserver",CONFIG_PATH="/data/lxserver/config.js",PORT="8005",BIND_IP="127.0.0.1"

[program:lxmusic]
directory=/srv/lxmusic-service
command=uvicorn app:app --host 0.0.0.0 --port 8003
autostart=false
autorestart=true
startretries=5
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:webui]
directory=/srv/webui-service
command=uvicorn app:app --host 0.0.0.0 --port 8004
autostart=false
autorestart=true
startretries=5
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
